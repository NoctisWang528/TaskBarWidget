; TaskBarWidgets 出厂默认配置
; 仅在 config.ini 不存在时按字节复制到配置目录，已有配置不会被覆盖。
; 与机器相关的项（网卡、温度传感器、字体、窗口位置）一律不写，由运行时自动选择。
[general]
; 只列出物理网卡，避免 WAN Miniport、VPN 等虚拟接口混入列表
show_all_interface = false
monitor_time_span = 1000
hard_disk_name = _Total
; 1 = CPU 温度，2 = GPU 温度
hardware_monitor_item = 3
; 只隐藏各机器都常见的微软虚拟适配器，第三方虚拟网卡由用户在设置里自行隐藏
connections_hide = "Bluetooth Device (Personal Area Network)","Microsoft Wi-Fi Direct Virtual Adapter","Microsoft Wi-Fi Direct Virtual Adapter #2"
cpu_usage_acquire_method = 0

[connection]
auto_select = true
select_all = false

[task_bar]
; 上传/下载/CPU/内存/GPU/CPU 温度/GPU 温度/总网速/CPU 频率/今日流量 的位掩码
tbar_display_item = 3196
font_size = 9
font_style = 0
up_string = "↑: "
down_string = "↓: "
total_speed_string = "↑↓: "
cpu_string = "CPU: "
memory_string = "内存: "
gpu_string = "GPU: "
cpu_temp_string = 
cpu_freq_string = 
gpu_temp_string = 
hdd_temp_string = "硬盘: "
main_board_temp_string = "主板: "
hdd_string = "硬盘: "
today_traffic_string = "总流量: "
task_bar_wnd_on_left = true
task_bar_wnd_snap = false
task_bar_speed_short_mode = false
unit_byte = true
task_bar_speed_unit = 0
task_bar_hide_unit = false
task_bar_hide_percent = false
value_right_align = false
horizontal_arrange = false
show_status_bar = false
separate_value_unit_with_space = true
digits_number = 3
memory_display = 2
double_click_action = 4
cm_graph_type = false
show_graph_dashed_box = false
item_space = 4
auto_adapt_light_theme = false
dark_default_style = 0
light_default_style = 3
auto_set_background_color = true
show_netspeed_figure = false
vertical_margin = 0
window_offset_top = 0
window_offset_left = 0
avoid_overlap_with_widgets = true
background_opacity = 100
graph_color_following_system = false
show_taskbar_wnd_in_secondary_display = false
secondary_display_index = 0
disable_d2d = true
enable_colorful_emoji = true
